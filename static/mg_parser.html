<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Minimalist grammar parser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="container mt-2">
      <div class="row d-flex align-items-stretch">
        <div class="col col-8">
          <div id="parse-tree" class="border border-3 rounded-3 border-primary h-100">
          </div>
        </div>
        <div class="col col-4">
            <form action="" id="parse" class="my-2">
            <div class="input-group my-2">
              <span class="input-group-text">Input category</span>
              <input
                class="form-control"
                type="text"
                name="category"
                id="category"
                aria-label="category"
              />
            </div>
            <div class="input-group mb-2">
              <span class="input-group-text">Min log prob</span>
              <input
                type="number"
                name="min_log_prob"
                class="form-control"
                value="-64"
                max="0"
                step="1"
              />
            </div>

            <div class="input-group mb-2">
              <span class="input-group-text">Max steps</span>
              <input
                type="number"
                class="form-control"
                value="250"
                min="1"
                step="1"
                name="max_steps"
              />
            </div>
            <div class="input-group mb-2">
              <span class="input-group-text">Max beams</span>
              <input
                type="number"
                class="form-control"
                value="50"
                min="1"
                step="1"
                name="max_beams"
              />
            </div>
            <div class="dropdown mb-2">
              <button
                class="btn btn-outline-secondary dropdown-toggle w-100"
                type="button"
                id="grammars"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Built-in grammars
              </button>
              <ul
                class="dropdown-menu"
                id="grammar-selection"
                aria-labelledby="grammars"
              ></ul>
            </div>
            <div class="mb-3 input-group">
              <span class="input-group-text">Grammar</span>
              <textarea class="form-control" name="grammar" id="grammar" rows="12"></textarea>
            </div>
            <div class="input-group mb-3">
                <input
                  class="form-control form-control-lg"
                  type="text"
                  name="sentence"
                  id="sentence"
                  placeholder="Enter sentence to parse"
                  aria-label="sentence"
                />
                <button class="btn btn-primary">Parse</button> 
            </div>
          </form>
        </div>
      </div>
      <div class="row">
        <div class="col col-8">
        </div>
        <div class="col col-4">
          <div id="errors"></div>
        </div>
      </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script src="./mg-viewer.js" type="module"></script>
  </body>
</html>
